<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#fff;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #d{width:1400px;height:800px}
  text{font-size:15px;fill:#1f2937}
  .lane{font-weight:700;font-size:16px}
  .small{font-size:13px;fill:#4b5563}
  .box text{font-size:14px}
  .title{font-size:24px;font-weight:700}
  .sub{font-size:15px;fill:#4b5563}
</style></head><body>
<svg id="d" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1400" height="800" fill="#ffffff"/>
  <text x="40" y="48" class="title">Simplified Gitflow — than-nong-agribiotech-system-one-decision-model</text>
  <text x="40" y="76" class="sub">No UAT: a release branch is tested locally / in staging. Production deploys only from a tag vX.Y.Z on main.</text>

  <!-- lanes -->
  <g>
    <rect x="30" y="112" width="860" height="70" rx="10" fill="#eff6ff"/>
    <rect x="30" y="232" width="860" height="70" rx="10" fill="#ecfdf5"/>
    <rect x="30" y="352" width="860" height="70" rx="10" fill="#fff7ed"/>
    <rect x="30" y="472" width="860" height="70" rx="10" fill="#f5f3ff"/>
    <text x="44" y="152" class="lane" fill="#1d4ed8">feature/*</text>
    <text x="44" y="272" class="lane" fill="#047857">develop</text>
    <text x="44" y="384" class="lane" fill="#c2410c">release/</text>
    <text x="44" y="404" class="lane" fill="#c2410c">vX.Y.Z</text>
    <text x="44" y="512" class="lane" fill="#6d28d9">main</text>
    <line x1="150" y1="267" x2="880" y2="267" stroke="#10b981" stroke-width="5"/>
    <line x1="150" y1="507" x2="880" y2="507" stroke="#8b5cf6" stroke-width="5"/>
    <line x1="200" y1="147" x2="300" y2="147" stroke="#3b82f6" stroke-width="5"/>
    <line x1="420" y1="387" x2="640" y2="387" stroke="#f97316" stroke-width="5"/>
  </g>

  <!-- feature → develop -->
  <path d="M170,267 C180,200 185,160 200,147" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <circle cx="230" cy="147" r="10" fill="#3b82f6"/><circle cx="280" cy="147" r="10" fill="#3b82f6"/>
  <path d="M290,152 C320,190 330,240 340,258" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="318" y="205" class="small">① PR (squash)</text>
  <circle cx="170" cy="267" r="10" fill="#10b981"/><circle cx="350" cy="267" r="11" fill="#10b981"/>

  <!-- develop → release branch -->
  <path d="M400,267 C410,330 412,370 420,387" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <circle cx="400" cy="267" r="10" fill="#10b981"/>
  <text x="300" y="336" class="small">② branch from develop</text>
  <circle cx="490" cy="387" r="10" fill="#f97316"/><circle cx="570" cy="387" r="10" fill="#f97316"/>
  <text x="440" y="446" class="small">fixes committed on release/vX.Y.Z</text>
  <text x="440" y="463" class="small">(+ CHANGELOG ## [X.Y.Z] — date)</text>

  <!-- release → main PR -->
  <path d="M630,392 C650,440 660,480 676,497" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="652" y="490" class="small" text-anchor="end">③ PR → main (merge)</text>
  <circle cx="690" cy="507" r="13" fill="#8b5cf6"/>
  <rect x="650" y="552" width="88" height="30" rx="15" fill="#6d28d9"/>
  <text x="694" y="573" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:14px">🏷 vX.Y.Z</text>
  <line x1="690" y1="520" x2="694" y2="552" stroke="#6d28d9" stroke-width="2"/>
  <text x="652" y="378" class="small" fill="#b91c1c">✕ deleted after ⑤</text>

  <!-- back-merge -->
  <path d="M703,497 C760,460 800,340 822,278" stroke="#059669" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#ag)"/>
  <circle cx="830" cy="267" r="11" fill="#10b981"/>
  <text x="806" y="420" class="small" style="fill:#047857;font-weight:600">⑤ back-merge</text>
  <text x="796" y="438" class="small" style="fill:#047857">main → develop</text>

  <!-- pipeline panel -->
  <rect x="910" y="100" width="460" height="620" rx="14" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="930" y="132" class="lane">GitHub Actions</text>
  <g class="box">
    <rect x="930" y="150" width="420" height="96" rx="10" fill="#fff" stroke="#9ca3af"/>
    <text x="946" y="176" style="font-weight:700">gitflow-guard.yml · PR into main</text>
    <text x="946" y="200">only release/vX.Y.Z may merge into main</text>
    <text x="946" y="220">CHANGELOG has ## [X.Y.Z] — YYYY-MM-DD</text>
    <text x="946" y="240">tag vX.Y.Z does not exist yet</text>

    <rect x="930" y="266" width="420" height="120" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="946" y="292" style="font-weight:700">release.yml · on merge release/vX.Y.Z → main</text>
    <text x="946" y="316">④ creates tag vX.Y.Z on the merge commit</text>
    <text x="946" y="338">④ publishes the GitHub Release</text>
    <text x="946" y="358">    (CHANGELOG section + notes generated</text>
    <text x="946" y="376">     from the merged PRs / commits)</text>

    <rect x="930" y="406" width="420" height="120" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="946" y="432" style="font-weight:700">No deployment yet</text>
    <text x="946" y="456">not ready for deployment: the release</text>
    <text x="946" y="478">is the tag vX.Y.Z + GitHub Release only</text>
    <text x="946" y="500">(add deploy.yml when it is ready)</text>

    <rect x="930" y="546" width="420" height="96" rx="10" fill="#fff" stroke="#059669" stroke-width="2"/>
    <text x="946" y="572" style="font-weight:700">release.yml · back-merge</text>
    <text x="946" y="596">⑤ merges main into develop, then deletes</text>
    <text x="946" y="616">    release/vX.Y.Z (conflict → PR main → develop)</text>
  </g>
  <path d="M1140,246 L1140,264" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1140,386 L1140,404" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1140,526 L1140,544" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="930" y="690" class="small">No branch protection on the free plan: never push to main / develop</text>
  <text x="930" y="708" class="small">directly; never merge a PR while gitflow-guard is red.</text>

  <!-- legend -->
  <text x="40" y="640" class="lane">Rules</text>
  <text x="40" y="668">① feature/* (or bugfix/*, docs/* …) from develop → PR into develop (squash).</text>
  <text x="40" y="692">② release/vX.Y.Z from develop; pre-release fixes go straight onto it.</text>
  <text x="40" y="716">③ PR release/vX.Y.Z → main (merge commit) when the release is ready.</text>
  <text x="40" y="740">④ the pipeline tags vX.Y.Z, publishes the GitHub Release, no deployment yet.</text>
  <text x="40" y="764">⑤ the pipeline merges main back into develop and deletes release/vX.Y.Z.</text>
</svg>
</body></html>
