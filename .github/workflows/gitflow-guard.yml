# Gitflow guard (simplified Gitflow, see GITHUB_COMMIT_RULE.md).
#
# The free GitHub plan has no branch protection, so this check marks a PR into `main` red when it breaks the rules:
#   - only `release/vX.Y.Z` may be merged into `main`;
#   - CHANGELOG.md on the release branch has the section `## [X.Y.Z] — YYYY-MM-DD`;
#   - the tag `vX.Y.Z` does not exist yet (a version is never reused).
# Never merge a PR into `main` while this check is red.
name: Gitflow guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  release-pr:
    name: Release PR into main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check branch name, CHANGELOG and tag
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! [[ "${BRANCH}" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Only release/vX.Y.Z branches may be merged into main (this PR is from '${BRANCH}'). Features go into develop."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if ! grep -qE "^## \[${VERSION//./\\.}\] (—|-) [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}] — YYYY-MM-DD' section"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists: pick the next version"
            exit 1
          fi
          echo "✅ release/v${VERSION} → main"
